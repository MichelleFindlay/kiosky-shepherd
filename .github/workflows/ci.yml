name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, json, zip, openssl, curl
          tools: phpstan
          coverage: none

      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: for f in admin/*.js; do node --check "$f"; done

      - name: Version numbers agree
        run: |
          v=$(grep -oP "SHEPHERD_VERSION', '\K[^']+" src/bootstrap.php)
          echo "Server version $v"
          bad=$(grep -oP '\?v=\K[0-9.]+' admin/index.html | grep -vx "$v" || true)
          [ -z "$bad" ] || { echo "admin/index.html still loads ?v=$bad; set it to $v so browsers fetch the new console" >&2; exit 1; }
          grep -q "\"version\": \"$v\"" custom_components/kiosky_shepherd/manifest.json \
            || { echo "custom_components/kiosky_shepherd/manifest.json version differs from $v" >&2; exit 1; }

      - name: PHPStan
        run: phpstan analyse --no-progress --memory-limit=1G

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Home Assistant
        run: pip install --quiet homeassistant

      - name: Every module imports against the real Home Assistant
        run: |
          python - <<'EOF'
          import importlib
          for m in ['', '.api', '.const', '.coordinator', '.entity', '.config_flow', '.sensor', '.binary_sensor', '.button']:
              importlib.import_module('custom_components.kiosky_shepherd' + m)
          print('imports ok')
          EOF

      - name: hassfest (Home Assistant's own manifest, services and strings checks)
        uses: home-assistant/actions/hassfest@master

  smoke:
    name: Smoke test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.0', 'mariadb:10.6']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shepherd
          MYSQL_USER: shepherd
          MYSQL_PASSWORD: shepherd
        ports: ['3306:3306']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, json, zip, openssl, curl
          coverage: none

      - name: Configure
        run: cp tests/ci-config.php config/config.php

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306;dbname=shepherd", "shepherd", "shepherd"); exit(0); } catch (Throwable $e) { exit(1); }' && exit 0
            sleep 2
          done
          echo "The database didn't start." >&2
          exit 1

      - name: Migrate
        run: |
          php bin/migrate.php
          php bin/migrate.php --status | grep -q 'up to date'

      - name: Create an admin
        run: printf 'ci-password-123\n' | php bin/create-admin.php ci admin

      - name: Seed a stable and a dev release for the channel checks
        run: |
          mysql -h127.0.0.1 -uroot -proot shepherd -e "INSERT INTO releases (version_name, version_code, sha256, size, file_name, channel)
            VALUES ('1.0.0', 100, REPEAT('a', 64), 1, 'missing.apk', 'stable'), ('1.1.0-dev.1', 110, REPEAT('b', 64), 1, 'missing.apk', 'dev')"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start a test SMTP server
        run: |
          pip install --quiet aiosmtpd
          python -u -m aiosmtpd -n -l 127.0.0.1:2525 -c aiosmtpd.handlers.Debugging > "$RUNNER_TEMP/smtp.log" 2>&1 &
          sleep 2

      - name: Start a webhook receiver
        run: |
          cat > "$RUNNER_TEMP/hook.py" <<'PY'
          import http.server, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  with open(sys.argv[1], 'ab') as f:
                      f.write(b'X-Shepherd-Signature: ' + (self.headers.get('X-Shepherd-Signature') or '').encode() + b'\n' + body + b'\n')
                  self.send_response(204)
                  self.end_headers()
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(('127.0.0.1', 8099), H).serve_forever()
          PY
          python -u "$RUNNER_TEMP/hook.py" "$RUNNER_TEMP/hooks.log" &
          sleep 1

      - name: Start the server
        run: |
          php -S 127.0.0.1:8080 index.php > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/v1/health && exit 0; sleep 1; done
          exit 1

      - name: Smoke test
        run: php tests/smoke.php http://127.0.0.1:8080 ci ci-password-123

      - name: The test email arrived over SMTP
        run: |
          cat "$RUNNER_TEMP/smtp.log"
          grep -q 'X-Mailer: KioskyShepherd' "$RUNNER_TEMP/smtp.log"
          grep -qi 'To: ci@example.com' "$RUNNER_TEMP/smtp.log"

      - name: Event webhooks arrived, signed
        run: |
          cat "$RUNNER_TEMP/hooks.log"
          grep -q '"event":"test"' "$RUNNER_TEMP/hooks.log"
          grep -q '"event":"device.enrolled"' "$RUNNER_TEMP/hooks.log"
          grep -q 'X-Shepherd-Signature: sha256=' "$RUNNER_TEMP/hooks.log"

      - name: Cron runs a due schedule
        run: |
          mysql -h127.0.0.1 -uroot -proot shepherd -e "UPDATE scheduled_commands SET next_run_at = UTC_TIMESTAMP() - INTERVAL 1 MINUTE"
          php bin/cron.php | tee "$RUNNER_TEMP/cron.out"
          grep -q 'ran 1 schedules' "$RUNNER_TEMP/cron.out"
          mysql -h127.0.0.1 -uroot -proot shepherd -N -e "SELECT next_run_at > UTC_TIMESTAMP() FROM scheduled_commands" | grep -qx 1

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
